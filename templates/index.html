<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>{{ title }}</title>
</head>
<body>
<div class="container">
  <div class="buttons">
    <button onclick="alert('Привет пупсик Оксана')" type="button" class="btn btn-primary">Мама</button>
    <button onclick="alert('Пойду помою голову')" type="button" class="btn btn-secondary">София</button>
    <button onclick="alert('привет Вергун')" type="button" class="btn btn-success">Вероника</button>
  </div>

  {% if form %}
  <form method="post">
    {{ form.csrf_token }}
    {{ form.num.label }} {{ form.num }}
    <button type="submit">Submit</button>
  </form>
  {% endif %}

  {% if num %}
  {% for i in range(num) %}
  <p>{{ i+1 }} Я тебя обожаю ❤️</p>
  {% endfor %}

  {% endif %}
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>
</body>
</html>
